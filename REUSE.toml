version = 1

exclude = [
  ".worktrees/**",
  ".venv/**",
  "src/pynxtools/definitions/**",
]

[[annotations]]
path = ["src/pynxtools/**"]
SPDX-FileCopyrightText = "The pynxtools Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["src/pynxtools/nomad/metainfo/**"]
SPDX-FileCopyrightText = [
  "NeXus International Advisory Committee (NIAC)",
  "The pynxtools Authors",
]
SPDX-License-Identifier = "LGPL-3.0-or-later"

# Non-code project files (docs, CI, tooling config) that can't practically
# carry an inline header.
[[annotations]]
path = ["docs/**"]
SPDX-FileCopyrightText = "The pynxtools Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  ".cspell/custom-dictionary.txt",
  ".github/**",
  ".gitignore",
  ".gitmodules",
  ".pre-commit-config.yaml",
  ".vscode/settings.json",
  "CITATION.cff",
  "MANIFEST.in",
  "README.md",
  "cspell.json",
  "mkdocs.yaml",
  "pyproject.toml",
]
SPDX-FileCopyrightText = "The pynxtools Authors"
SPDX-License-Identifier = "Apache-2.0"

# Example and test fixtures/readmes: data files, not source, so no inline header.
[[annotations]]
path = [
  "examples/README.md",
  "examples/custom-application-definition/README.md",
  "examples/json_map/**",
  "examples/mock-data-reader/README.md",
  "examples/mock-data-reader/config_file.json",
  "examples/mock-data-reader/eln_data.yaml",
  "examples/mock-data-reader/mock_data.h5",
  "examples/mock-data-reader/output.nxs",
]
SPDX-FileCopyrightText = "The pynxtools Authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "tests/annotator/README.md",
  "tests/dataconverter/README.md",
  "tests/nexus/README.md",
  "tests/data/**",
]
SPDX-FileCopyrightText = "The pynxtools Authors"
SPDX-License-Identifier = "Apache-2.0"

# Example NeXus application definitions generated by the nyaml tool
# (fairmat/nyaml). nyaml stamps its own fixed NIAC/LGPL boilerplate into every
# .nxdl.xml it produces and preserves it verbatim on regeneration, so this is
# annotated here to match reality rather than hand-edited generated output.
# TODO(nyaml): teach nyaml2nxdl.py's DOM_COMMENT template to emit a proper
# SPDX-License-Identifier tag so this annotation becomes unnecessary.
[[annotations]]
path = [
  "examples/custom-application-definition/NXdouble_slit.nxdl.xml",
  "examples/custom-application-definition/NXlaser.nxdl.xml",
  "examples/mock-data-reader/NXsimple.nxdl.xml",
]
SPDX-FileCopyrightText = [
  "NeXus International Advisory Committee (NIAC)",
  "The pynxtools Authors",
]
SPDX-License-Identifier = "LGPL-3.0-or-later"